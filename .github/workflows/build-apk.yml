name: Build & Publish DRxGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build DRxGuard APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required by AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install API 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Firebase Config, Debug Keystore & App Check Token from Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
        run: |
          # 1. Restore app/google-services.json (supports both raw JSON and Base64)
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            FIRST_CHAR=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | cut -c1)
            if [ "$FIRST_CHAR" = "{" ]; then
              echo "Writing raw GOOGLE_SERVICES_JSON secret to app/google-services.json"
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "Decoding Base64 GOOGLE_SERVICES_JSON secret to app/google-services.json"
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n ' | base64 -d > app/google-services.json
            fi
          fi

          if [ ! -f "app/google-services.json" ]; then
            echo "::error::Missing app/google-services.json! Add GOOGLE_SERVICES_JSON in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # 2. Restore debug.keystore (from Secret, repo file, or fallback keytool)
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Decoding debug.keystore from DEBUG_KEYSTORE_BASE64 secret"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64"
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Optional: Inject Firebase App Check Debug Token for physical-device debug APKs
          if [ -n "$FIREBASE_APPCHECK_DEBUG_TOKEN" ]; then
            CLEAN_APPCHECK_TOKEN=$(printf '%s' "$FIREBASE_APPCHECK_DEBUG_TOKEN" | tr -d '[:space:]"')
            if [ -n "$CLEAN_APPCHECK_TOKEN" ]; then
              echo "Injecting FIREBASE_APPCHECK_DEBUG_TOKEN into debug resources"
              mkdir -p app/src/debug/res/values
              printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="firebase_appcheck_debug_token" translatable="false">%s</string>\n</resources>\n' "$CLEAN_APPCHECK_TOKEN" > app/src/debug/res/values/appcheck_debug_token.xml
            fi
          fi

          echo "All build configs verified successfully."

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          gradle :app:assembleDebug \
            --no-configuration-cache \
            --max-workers=2 \
            --console=plain

      - name: Prepare Direct Download APK
        run: |
          mkdir -p release-apk
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          cp "$APK_FILE" release-apk/DRxGuard.apk
          ls -lh release-apk/DRxGuard.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DRxGuard-APK
          path: release-apk/DRxGuard.apk
          retention-days: 30

      - name: Publish Direct Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: DRxGuard Latest APK
          body: |
            Automated build of **DRxGuard** Android APK.
            Tap **DRxGuard.apk** below to download and install directly on Android.
          files: release-apk/DRxGuard.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
