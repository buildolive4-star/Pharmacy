name: Build & Publish DRxGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-apk:
    name: Build DRxGuard APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required by AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install API 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore & Verify Config
        run: |
          if [ -f "debug.keystore" ]; then
            echo "Using existing debug.keystore"
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64"
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            echo "Generating fallback debug.keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "app/google-services.json" ]; then
            echo "::error::app/google-services.json is missing in this GitHub repository! Please push/upload app/google-services.json from AI Studio so Firebase & Google Sign-In can compile."
            exit 1
          fi
          echo "Verified app/google-services.json and debug.keystore are present."

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          gradle :app:assembleDebug \
            --no-configuration-cache \
            --max-workers=2 \
            --console=plain

      - name: Prepare Direct Download APK
        run: |
          mkdir -p release-apk
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found in app/build/outputs/apk/debug"
            exit 1
          fi
          cp "$APK_FILE" release-apk/DRxGuard.apk
          ls -lh release-apk/DRxGuard.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DRxGuard-APK
          path: release-apk/DRxGuard.apk
          retention-days: 30

      - name: Publish Direct Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: DRxGuard Latest APK
          body: |
            Automated build of **DRxGuard** Android APK.
            Tap **DRxGuard.apk** below to download and install directly on Android.
          files: release-apk/DRxGuard.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
